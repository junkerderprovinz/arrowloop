# The default rules do the work. The group files ArrowLoop 2.6 wrote for the
# migration test hold the public member keys of throwaway test instances, which
# the generic rule takes for API keys.

[extend]
useDefault = true

[allowlist]
description = "Public member keys in the group files of the migration test, and the example keys from the wg(8) manual page that the VPN tests parse"
paths = ['''internal/pairing/testdata/before-kit/[a-z]+/group\.json''']
regexes = [
  '''yAnz5TF\+lXXJte14tji3zlMNq\+hd2rYUIgJBgB3fBmk=''',
  '''xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg=''',
  '''4ff3SshWJvhM3cdqXk4ws3pPN7QJgBXZXEx4pMm8kVY=''',
]
