site_name: ArrowLoop
site_description: Two-way file synchronisation with a per-file state database, a trash, and brakes that refuse an implausible deletion.
site_url: https://junkerderprovinz.github.io/arrowloop/
site_author: Junker der Provinz

repo_url: https://github.com/junkerderprovinz/arrowloop
repo_name: junkerderprovinz/arrowloop
edit_uri: edit/main/docs/

copyright: Copyright (C) 2026 Junker der Provinz. Licensed AGPL-3.0.

theme:
  name: material
  language: en
  custom_dir: docs-theme/overrides
  # The mark reads on both palettes, so one file serves both headers.
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Noto Sans
    code: Noto Sans Mono
  palette:
    # Without media queries Material takes the first palette as the default,
    # so the site opens dark whatever the operating system prefers.
    - scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

extra:
  docs_theme:
    accent: "#FCC419"
    hero:
      claim: Two-way file sync
      accent: that shows you the plan before it moves anything.
      text: ArrowLoop keeps two folders in step, say a NAS share and a laptop, or a phone and a WebDAV cloud. It remembers what both sides last agreed on, lists every change before a run, and stops rather than delete more than it should.
      buttons:
        - { text: Get started, link: installing/, primary: true }
        - { text: How it compares, link: comparison/ }
        - { text: Source code, link: "https://github.com/junkerderprovinz/arrowloop" }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: index.md
  - Installing: installing.md
  - Configuring a job: configuration.md
  - The interface: interface.md
  - Command line: cli.md
  - How it decides: decisions.md
  - Safety: safety.md
  - How it compares: comparison.md
  - How it is tested: testing.md
  - When something goes wrong: troubleshooting.md
