# Builds the desktop app as a Flatpak from this checkout:
#
#     flatpak-builder --user --install --force-clean --state-dir=flatpak/.state \
#       flatpak/.build flatpak/io.github.junkerderprovinz.arrowloop.yml
#
# The build has no network, so every Go module and npm package comes from
# go-sources.json and node-sources.json. node flatpak/update-sources.mjs writes
# both again after a dependency changes.
id: io.github.junkerderprovinz.arrowloop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: arrowloop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The jobs reach SFTP, SMB, WebDAV, S3 and the cloud services rclone speaks.
  - --share=network
  # A job may sync any folder the person picks: anything in the home folder,
  # and the drives and shares mounted under the other three.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # A held job and a failed run are told as a notification while the window
  # is in the tray.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon, which brings the hidden window back.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: arrowloop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOTOOLCHAIN: local
        GOFLAGS: -modcacherw
        GOPROXY: file:///run/build/arrowloop/gomod
        GOSUMDB: 'off'
        GOMODCACHE: /run/build/arrowloop/gomodcache
        GOCACHE: /run/build/arrowloop/gocache
        CGO_ENABLED: '1'
    build-commands:
      - npm --prefix web ci --offline --no-audit --no-fund --cache=$FLATPAK_BUILDER_BUILDDIR/flatpak-node/npm-cache
      - npm --prefix web run build
      # The newest release in the metainfo is the version the About card shows,
      # so a tag cannot ship without its release entry.
      - >-
        version=$(sed -n 's|.*<release version="\([^"]*\)".*|\1|p' flatpak/io.github.junkerderprovinz.arrowloop.metainfo.xml | head -1);
        cd desktop && go build -tags production,gtk3 -trimpath -buildvcs=false
        -ldflags "-s -w -X github.com/junkerderprovinz/arrowloop/internal/boot.Version=v$version"
        -o arrowloop .
      - install -Dm755 desktop/arrowloop $FLATPAK_DEST/bin/arrowloop
      - install -Dm644 flatpak/$FLATPAK_ID.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 flatpak/$FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm644 desktop/installer/logo.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 desktop/installer/icon.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - web/node_modules
          - flatpak/.state
          - flatpak/.build
          - flatpak/.repo
      - go-sources.json
      - node-sources.json
