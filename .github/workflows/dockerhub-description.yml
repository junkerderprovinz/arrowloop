# Pushes .github/dockerhub/README.md to the Docker Hub repo's Overview, on
# demand and nothing else.
#
# container.yml syncs the same file after every image push, but only after a
# full multi-arch build, and lets a refused update pass so a release is not
# held up by its description. That makes it useless for answering the one
# question worth answering when the sync starts failing: is the credential
# broken, or is this repo's secret wrong? A run that builds nothing and fails
# loudly isolates the credential. It is also the way to publish an edit to the
# overview without waiting for the next image.
#
# Manual only. It never builds, never pushes an image, and touches nothing but
# the description text on Docker Hub.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync the overview to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No gate and no continue-on-error: this workflow exists to make a failure
      # visible, so a missing secret or a refused login must turn the run red
      # instead of passing quietly.
      - name: Sync the overview to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/arrowloop
          short-description: "Two-way file sync that shows you the plan before it moves anything."
          readme-filepath: .github/dockerhub/README.md
