name: Desktop build

# Builds the desktop bundles and keeps them as artifacts. It attaches
# nothing: on a release tag release.yml calls this, waits for it and for the
# app, and creates the release with every file at once.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The installer is what a release ships for Windows.
          - os: windows-latest
            slug: windows-amd64
            args: "--arch amd64 --installer"
          # Built on an ARM runner rather than cross-compiled, so a build that
          # only breaks on ARM breaks here.
          - os: windows-11-arm
            slug: windows-arm64
            args: "--arch arm64 --installer"
          - os: macos-latest
            slug: macos-universal
            args: ""
          - os: ubuntu-latest
            slug: linux-amd64
            args: "--arch amd64"
          # Native as well: WebKitGTK is linked through cgo, and Wails does not
          # cross-compile to Linux.
          - os: ubuntu-24.04-arm
            slug: linux-arm64
            args: "--arch arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # The version stamp is `git describe`, which needs the tags and the
      # commit count a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # NSIS on the runner image is not guaranteed, and a missing makensis
      # would only surface at the last step.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, and that change does not reach this
          # already-running job process.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The CLI writes the build assets for the library, so its version is read
      # from desktop/go.mod, which Renovate keeps current. sed rather than
      # grep -P, which BSD grep on macOS lacks. The CLI links the Linux webview
      # too, and without the tag it wants GTK 4, which the runner does not
      # have. Elsewhere the tag changes nothing.
      - name: Install the Wails CLI
        working-directory: desktop
        shell: bash
        run: |
          version=$(sed -n 's|.*github\.com/wailsapp/wails/v3 \(v[0-9][0-9A-Za-z.-]*\).*|\1|p' go.mod | head -1)
          if [ -z "$version" ]; then
            echo "could not read the wails version out of desktop/go.mod" >&2
            exit 1
          fi
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"$version"

      - name: Install the interface dependencies
        run: npm --prefix web ci --no-audit --no-fund

      # Worked out once, on the clean tree, and read by every step after.
      - name: Work out the version
        run: node scripts/stamp.mjs --github-env

      # Builds the interface, has Wails write the manifest, icons, version
      # resource and Info.plist, and compiles; on Windows it also makes the
      # installer.
      - name: Build
        run: node scripts/desktop.mjs ${{ matrix.args }}

      # The .app is wrapped into a .dmg for a first install and into a zip for
      # the app's own updates, and the bare .app removed from the artifact. The
      # zip leaves out resource forks and extended attributes, which would land
      # in the bundle as files its signature does not cover.
      #
      # The size is explicit because `hdiutil create -srcfolder` otherwise
      # estimates its scratch image, and a short estimate fails inside that
      # image with "No space left on device" however much the runner has free.
      # The app's own size plus 200 MB of slack follows the product as it grows.
      - name: Package the macOS app into a dmg and a zip
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          df -h /
          cache=$(go env GOCACHE)
          modcache=$(go env GOMODCACHE)
          go clean -cache -modcache || true
          # setup-go saves both in a post step and fails on a missing path.
          mkdir -p "$cache" "$modcache"
          rm -rf ../web/node_modules
          df -h /
          need=$(du -sm build/bin/ArrowLoop.app | cut -f1)
          echo "app is ${need} MB, asking hdiutil for $((need + 200)) MB"
          hdiutil create -volname "ArrowLoop" -srcfolder build/bin/ArrowLoop.app \
            -ov -format UDZO -size "$((need + 200))m" build/bin/ArrowLoop.dmg
          ditto -c -k --norsrc --noextattr --keepParent build/bin/ArrowLoop.app build/bin/ArrowLoop.zip
          rm -rf build/bin/ArrowLoop.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arrowloop-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error
