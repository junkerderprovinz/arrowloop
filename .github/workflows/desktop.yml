name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            # -nsis produces a real installer alongside the portable exe in the
            # same build/bin output, so somebody who wants a Start Menu entry
            # and somebody who wants a single file both get what they want.
            extra: "-nsis"
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            extra: ""
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            extra: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # Full history and tags, because the version stamp is `git describe`. A
      # shallow checkout has no tags to describe against and a commit count of
      # 1, so the release bundles would carry a bare hash in the properties
      # dialog and 0.0.0.1 in the numeric field, on the one build where the
      # number matters most.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # -nsis shells out to makensis. windows-latest has historically carried
      # NSIS preinstalled, but that is an implicit runner-image detail rather
      # than a promise, and wails degrades to a warning rather than an error
      # when it is missing, so the installer would quietly stop being built.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, and that change does not reach this
          # already-running job process.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Pinned to the same version desktop/go.mod requires. Renovate bumps the
      # library but has no way to catch a version pinned inside a shell string
      # in a workflow, so these two have to be moved together by hand.
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Only the install. Building the interface and copying it into the shell
      # is wails.json's frontend:build, so it happens on a laptop as well as
      # here; doing it a second time in this file would be the copy that gets
      # forgotten when the other one moves.
      - name: Install the interface dependencies
        run: npm --prefix web ci --no-audit --no-fund

      # One source of truth for what this build is called, shared with
      # scripts/build-windows.mjs and read by wails.json's own frontend:build
      # step when it writes the Windows version resource.
      - name: Work out the version
        run: node scripts/stamp.mjs --github-env

      # The NSIS installer takes its version from wails.json and nowhere else,
      # so the file is stamped before the build and put back after it. Left
      # alone it ships Wails' own default of "1.0.0" and shows that in Apps and
      # features: a number that never belonged to any build.
      #
      # ARROWLOOP_VERSION was worked out above while the tree was still clean,
      # and every later reader takes it from there, so the edit below cannot
      # make a clean commit call itself "-dirty".
      - name: Stamp the installer version
        if: runner.os == 'Windows'
        run: node scripts/stamp.mjs --stamp-installer

      # The ldflags are not optional here, and leaving them off is the specific
      # failure this whole stamp exists to prevent. Without them boot.Version
      # stays "dev", so a released bundle would show "dev" on its About card
      # while the properties dialog of the very same file showed the tag: two
      # answers to one question, from one build.
      #
      # `-s -w` was missing and that was 14.2 MB of nothing, measured on this
      # tree: 49.5 MB without, 35.3 MB with, for a bundle whose whole point is
      # that somebody downloads it. It strips the symbol table and the DWARF -
      # a debugger's furniture. Go's own panic traces come from separate
      # runtime tables and are unaffected, which is what makes this free rather
      # than a trade. The container build has carried these two since it
      # existed; the desktop simply never got them.
      #
      # `-trimpath` is a different kind of win and a much smaller one: 0.11 MB.
      # It is here because it takes the build machine's directory layout out of
      # the binary, so the same commit produces the same bytes on a runner and
      # on somebody's laptop.
      - name: Build
        working-directory: desktop
        run: >
          wails build -platform ${{ matrix.platform }} -clean -trimpath ${{ matrix.extra }}
          -ldflags "-s -w -X github.com/junkerderprovinz/arrowloop/internal/boot.Version=${{ env.ARROWLOOP_VERSION }}"

      # The runner is thrown away either way, but a restored tree means the next
      # step in this job sees the commit it was given rather than an edited one.
      - name: Put wails.json back
        if: always() && runner.os == 'Windows'
        run: git checkout -- desktop/wails.json

      # macOS gets no installer step from wails, so the .app is wrapped into the
      # .dmg that is Apple's own convention. hdiutil is on every runner. The bare
      # .app goes afterwards so the artifact holds the one file somebody should
      # actually download.
      #
      # THE SIZE IS EXPLICIT, and that is the whole fix. Left to itself,
      # `hdiutil create -srcfolder` estimates how big a scratch image it needs
      # and then copies the app into it; when the estimate falls short the copy
      # fails INSIDE that image with "No space left on device", which names the
      # wrong disk and sends anybody reading it to look at the runner's own free
      # space. That is exactly what happened here: an earlier round read the
      # message at face value, cleared the Go caches, saw two green runs and
      # called it fixed. It came back on v0.2.0 with `df` reporting 95 GiB free
      # on the line directly above the failure, which is the proof the disk was
      # never the problem and the two green runs were luck.
      #
      # `du` plus a fixed 200 MB of slack, rather than a guessed total: the app
      # is a universal binary and its size moves with the product, so a hard
      # number would be a fresh estimate to get wrong later.
      #
      # The cache clean stays. It was not the fix, but a universal build does
      # compile this tree twice and there is no reason to carry the caches into
      # the packaging step now that nothing needs them.
      - name: Package the macOS app into a dmg
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          df -h /
          cache=$(go env GOCACHE)
          modcache=$(go env GOMODCACHE)
          go clean -cache -modcache || true
          # Recreated empty, because setup-go saves both of these in a post
          # step and refuses a path that is not there. An empty cache costs a
          # slower next run; a missing one fails the job after it passed.
          mkdir -p "$cache" "$modcache"
          rm -rf ../web/node_modules
          df -h /
          need=$(du -sm build/bin/ArrowLoop.app | cut -f1)
          echo "app is ${need} MB, asking hdiutil for $((need + 200)) MB"
          hdiutil create -volname "ArrowLoop" -srcfolder build/bin/ArrowLoop.app \
            -ov -format UDZO -size "$((need + 200))m" build/bin/ArrowLoop.dmg
          rm -rf build/bin/ArrowLoop.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arrowloop-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error

  # Without this the bundles are built on every tag and then thrown away when
  # the artifact expires: green CI, and nobody outside Actions can download the
  # desktop app at all.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bundles

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp bundles/arrowloop-windows-amd64/ArrowLoop.exe \
            "dist/arrowloop-${GITHUB_REF_NAME}-windows-amd64-portable.exe"
          cp bundles/arrowloop-windows-amd64/*-installer.exe \
            "dist/arrowloop-${GITHUB_REF_NAME}-windows-amd64-installer.exe"
          cp bundles/arrowloop-macos-universal/ArrowLoop.dmg \
            "dist/arrowloop-${GITHUB_REF_NAME}-macos-universal.dmg"
          cp bundles/arrowloop-linux-amd64/ArrowLoop \
            "dist/arrowloop-${GITHUB_REF_NAME}-linux-amd64"
          chmod +x "dist/arrowloop-${GITHUB_REF_NAME}-linux-amd64"

          # A second copy of each bundle under a name with no version in it.
          #
          # This is what makes a download button in the README possible at all.
          # GitHub serves the newest release's asset from
          # /releases/latest/download/<EXACT NAME>, and there is no pattern, no
          # wildcard and no "whatever matches" - so a name carrying the version
          # can only ever be linked for the one release it belongs to, and every
          # button in the README would go stale on the next tag.
          #
          # A copy rather than a rename, because the versioned name is the one
          # worth keeping: a folder holding three downloads called
          # arrowloop-windows-installer.exe is a folder nobody can tell apart.
          # The cost is the upload, and a public release has no storage bill.
          for f in dist/arrowloop-"${GITHUB_REF_NAME}"-*; do
            cp "$f" "$(echo "$f" | sed "s/-${GITHUB_REF_NAME}-/-/")"
          done
          ls -lh dist

      # The release is expected to exist by the time these are ready, but a
      # desktop build can easily outlast release creation and a runner queue can
      # invert the order further. Waiting beats racing.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "no release for $GITHUB_REF_NAME after five minutes" >&2
          exit 1

      - name: Attach the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
