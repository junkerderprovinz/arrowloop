name: Desktop build

# Builds the desktop bundles and keeps them as artifacts. It attaches
# nothing: on a release tag release.yml calls this, waits for it and for the
# app, and creates the release with every file at once.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            # An installer alongside the portable exe.
            extra: "-nsis"
          # Built on an ARM runner rather than cross-compiled, so a build that
          # only breaks on ARM breaks here.
          - os: windows-11-arm
            platform: windows/arm64
            slug: windows-arm64
            extra: "-nsis"
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            extra: ""
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            extra: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # The version stamp is `git describe`, which needs the tags and the
      # commit count a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # NSIS on the runner image is not guaranteed, and wails only warns when
      # makensis is missing, so the installer would quietly stop being built.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, and that change does not reach this
          # already-running job process.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Must match the version desktop/go.mod requires; Renovate cannot see a
      # version inside a shell string, so the two move together by hand.
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Building the interface is wails.json's frontend:build, so it runs the
      # same way on a laptop.
      - name: Install the interface dependencies
        run: npm --prefix web ci --no-audit --no-fund

      # Shared with scripts/build-windows.mjs and read by wails.json's
      # frontend:build when it writes the Windows version resource.
      - name: Work out the version
        run: node scripts/stamp.mjs --github-env

      # The NSIS installer reads its version only from wails.json, and would
      # otherwise show Wails' default "1.0.0" in Apps and features. The version
      # was worked out above on the clean tree, so this edit cannot make the
      # build call itself "-dirty".
      - name: Stamp the installer version
        if: runner.os == 'Windows'
        run: node scripts/stamp.mjs --stamp-installer

      # Without the -X flag boot.Version stays "dev", and the About card would
      # disagree with the file's properties dialog. -s -w drop the symbol table
      # and DWARF (about 14 MB; panic traces use separate runtime tables), and
      # -trimpath makes the same commit produce the same bytes anywhere.
      - name: Build
        working-directory: desktop
        run: >
          wails build -platform ${{ matrix.platform }} -clean -trimpath ${{ matrix.extra }}
          -ldflags "-s -w -X github.com/junkerderprovinz/arrowloop/internal/boot.Version=${{ env.ARROWLOOP_VERSION }}"

      # Later steps see the commit as given rather than an edited one.
      - name: Put wails.json back
        if: always() && runner.os == 'Windows'
        run: git checkout -- desktop/wails.json

      # wails has no macOS installer step, so the .app is wrapped into a .dmg
      # and the bare .app removed from the artifact.
      #
      # The size is explicit because `hdiutil create -srcfolder` otherwise
      # estimates its scratch image, and a short estimate fails inside that
      # image with "No space left on device" however much the runner has free.
      # The app's own size plus 200 MB of slack follows the product as it grows.
      - name: Package the macOS app into a dmg
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          df -h /
          cache=$(go env GOCACHE)
          modcache=$(go env GOMODCACHE)
          go clean -cache -modcache || true
          # setup-go saves both in a post step and fails on a missing path.
          mkdir -p "$cache" "$modcache"
          rm -rf ../web/node_modules
          df -h /
          need=$(du -sm build/bin/ArrowLoop.app | cut -f1)
          echo "app is ${need} MB, asking hdiutil for $((need + 200)) MB"
          hdiutil create -volname "ArrowLoop" -srcfolder build/bin/ArrowLoop.app \
            -ov -format UDZO -size "$((need + 200))m" build/bin/ArrowLoop.dmg
          rm -rf build/bin/ArrowLoop.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arrowloop-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error
