name: Release

# Fires on the version tag and publishes the hand-written notes for it, with
# every download attached.
#
# The README's download buttons point at /releases/latest/download/<name>, and a
# release is "latest" from the moment it is published, so the release is created
# last, with all files at once, once every build is done. A failed build leaves
# no release; re-running the failed jobs finishes it. The image's `latest` tag
# follows the same rule, so the badge, the buttons and `docker pull` name the
# same version.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Builds and packages without publishing, so a change to this chain can be
  # tried before a tag depends on it, even on a tag ref. The app is debug-signed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before forty minutes of builds rather than after them.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the notes exist
        if: github.ref_type == 'tag'
        run: |
          set -eu
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "no release notes at $notes" >&2
            echo "A release without notes is a tag, and a tag is not a release." >&2
            exit 1
          fi

  desktop:
    needs: notes
    uses: ./.github/workflows/desktop.yml

  mobile:
    needs: notes
    uses: ./.github/workflows/mobile.yml
    # The release key, for a signed APK.
    secrets: inherit

  # The image for this version, without `latest`, which image-latest moves once
  # the release is out.
  container:
    needs: notes
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  # The README offers the image too, so a release waits for it as well.
  publish:
    needs: [desktop, mobile, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # Decided once, by publish-release.sh.
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: arrowloop-*
          path: bundles

      # One file per build, under a name without the version, because
      # /releases/latest/download/ takes an exact name only. Each build says
      # its version itself: the exe's properties, the About card,
      # `arrowloop version` and Android's app info. The x86_64 APK stays a CI
      # artifact, since only an emulator runs it.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp bundles/arrowloop-windows-amd64/ArrowLoop.exe dist/arrowloop-windows-amd64-portable.exe
          cp bundles/arrowloop-windows-amd64/*-installer.exe dist/arrowloop-windows-amd64-installer.exe
          cp bundles/arrowloop-windows-arm64/ArrowLoop.exe dist/arrowloop-windows-arm64-portable.exe
          cp bundles/arrowloop-windows-arm64/*-installer.exe dist/arrowloop-windows-arm64-installer.exe
          cp bundles/arrowloop-macos-universal/ArrowLoop.dmg dist/arrowloop-macos-universal.dmg
          cp bundles/arrowloop-linux-amd64/ArrowLoop dist/arrowloop-linux-amd64
          chmod +x dist/arrowloop-linux-amd64
          cp bundles/arrowloop-mobile/arrowloop-app-arm64-v8a-release.apk dist/arrowloop-android-arm64.apk
          ls -lh dist

      # Only from a pushed tag; a dispatched run stops after packaging. The
      # checks before publishing, and the rule for "Latest", are in the script.
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/*

  # `latest` on the image means the newest released version. It follows the
  # answer publish-release.sh gave for the "Latest" badge, so a version whose
  # release never came out cannot take it and re-cutting an older one cannot
  # drag it back. imagetools copies the manifest; nothing is rebuilt.
  image-latest:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest to this release
        env:
          # Written out rather than built from the repository name, which
          # imagetools would not lowercase for us.
          IMAGE: ghcr.io/junkerderprovinz/arrowloop
          HUB: ${{ vars.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/arrowloop', vars.DOCKERHUB_USERNAME) || '' }}
          LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -eu
          # Empty means publish-release.sh never said, and a silent skip would
          # leave the badge and the image tag on different versions.
          case "$LATEST" in
            true) ;;
            false) echo "the release is not the newest one, so latest stays where it is"; exit 0 ;;
            *) echo "::error::publish did not say whether $GITHUB_REF_NAME is the latest release, so the image tag is not moved blindly."; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          # metadata-action and this job derive the tag separately, so check it
          # exists before moving latest.
          docker buildx imagetools inspect "${IMAGE}:${version}" > /dev/null
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${version}"
          echo "${IMAGE}:latest is ${version}"
          if [ -n "$HUB" ]; then
            docker buildx imagetools create --tag "${HUB}:latest" "${HUB}:${version}"
            echo "${HUB}:latest is ${version}"
          fi
