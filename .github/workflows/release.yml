name: Release

# Fires on the version tag and publishes the hand-written notes for it. There is
# deliberately no auto-generated changelog: a list of commit subjects is a
# record of what was typed, not of what changed for the person reading it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the notes exist
        run: |
          set -eu
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "no release notes at $notes" >&2
            echo "A release without notes is a tag, and a tag is not a release." >&2
            exit 1
          fi

      # AS A DRAFT. desktop.yml and mobile.yml attach the downloads twenty
      # minutes and more later, and the README's buttons point at
      # /releases/latest/download/. Published at once, the release was "latest"
      # with nothing on it and every button answered 404 for that long. The
      # draft goes public when the last of those uploads is done; see
      # .github/scripts/publish-when-complete.sh. A re-run finds the draft it
      # made rather than adding a second one.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
