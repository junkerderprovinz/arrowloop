name: Release

# Fires on the version tag and publishes the hand-written notes for it, with
# every download attached. There is deliberately no auto-generated changelog: a
# list of commit subjects is a record of what was typed, not of what changed for
# the person reading it.
#
# THE RELEASE COMES LAST. The README's download buttons point at
# /releases/latest/download/<name>, and a release is "latest" from the moment it
# is published. It used to be published straight away, while desktop.yml and
# mobile.yml attached their files twenty minutes and more later, each on its
# own, so every release left the buttons answering 404 for that long. Now this
# workflow runs both builds and creates the release only when both are done,
# with all the files in one command (.github/scripts/publish-release.sh). A
# build that fails leaves no release at all; re-running the failed jobs
# finishes it.
#
# The container image is built here as well, and `latest` on it moves only once
# the release is out, by the same rule, so the badge, the download buttons and
# `docker pull` never name different versions.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Runs both builds and packages the files, and publishes nothing, so a change
  # to this chain can be tried before a tag depends on it. A run dispatched on a
  # tag ref is such a test too. The app it builds is debug-signed: signing
  # belongs to a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before forty minutes of builds rather than after them.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the notes exist
        if: github.ref_type == 'tag'
        run: |
          set -eu
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "no release notes at $notes" >&2
            echo "A release without notes is a tag, and a tag is not a release." >&2
            exit 1
          fi

  desktop:
    needs: notes
    uses: ./.github/workflows/desktop.yml

  mobile:
    needs: notes
    uses: ./.github/workflows/mobile.yml
    # The release key, for a signed APK.
    secrets: inherit

  # The image for this version, with its smoke test. It carries no `latest`:
  # that one is moved below, once the release is out. On a dispatched run it
  # builds both architectures and pushes nothing, like every other job here.
  container:
    needs: notes
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  # The image is one of the things the README offers, so a release waits for it
  # as it waits for the bundles: a published release always has both.
  publish:
    needs: [desktop, mobile, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # Decided by publish-release.sh, so image-latest below does not decide it
      # a second time.
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The bundles and the APKs, each in a folder named after its artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: arrowloop-*
          path: bundles

      # The version in every name, so a download in somebody's folder still says
      # what it is. And a second copy of each without it, which is what makes a
      # download button possible at all: GitHub serves the newest release's asset
      # from /releases/latest/download/<EXACT NAME>, with no pattern and no
      # wildcard, so a name carrying the version could only ever be linked for
      # the one release it belongs to. A copy rather than a rename, because a
      # folder holding three files called arrowloop-windows-installer.exe is a
      # folder nobody can tell apart.
      #
      # The Android APKs: arm64 is every phone sold in the last decade, x86_64
      # is an emulator. The README links arm64.
      #
      # A dispatched run from a branch such as fix/x has a slash in its ref
      # name, which a file name cannot hold.
      - name: Package
        run: |
          set -eu
          v="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp bundles/arrowloop-windows-amd64/ArrowLoop.exe "dist/arrowloop-${v}-windows-amd64-portable.exe"
          cp bundles/arrowloop-windows-amd64/*-installer.exe "dist/arrowloop-${v}-windows-amd64-installer.exe"
          cp bundles/arrowloop-macos-universal/ArrowLoop.dmg "dist/arrowloop-${v}-macos-universal.dmg"
          cp bundles/arrowloop-linux-amd64/ArrowLoop "dist/arrowloop-${v}-linux-amd64"
          chmod +x "dist/arrowloop-${v}-linux-amd64"
          cp bundles/arrowloop-mobile/arrowloop-app-arm64-v8a-release.apk "dist/arrowloop-${v}-android-arm64.apk"
          cp bundles/arrowloop-mobile/arrowloop-app-x86_64-release.apk "dist/arrowloop-${v}-android-x86_64.apk"
          for f in dist/arrowloop-"${v}"-*; do
            cp "$f" "dist/$(basename "$f" | sed "s/^arrowloop-${v}-/arrowloop-/")"
          done
          ls -lh dist

      # Only from a pushed tag; a dispatched run stops after packaging. The
      # checks before publishing, and the rule for "Latest", are in the script.
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/*

  # `latest` on the image means "the newest released version", and nothing else.
  #
  # It moves here rather than in the build, and only once the release exists and
  # carries the "Latest" badge: the badge, the download buttons and
  # `docker pull …:latest` then always name the same version, because the answer
  # is the one publish-release.sh already gave. A version whose release never
  # came out cannot take it, and re-cutting an older one cannot drag it back.
  # Pointing `latest` at the version just pushed copies the manifest in the
  # registry; nothing is rebuilt, and imagetools needs no builder for it.
  image-latest:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this release
        env:
          # Written out rather than built from the repository name, which
          # imagetools would not lowercase for us.
          IMAGE: ghcr.io/junkerderprovinz/arrowloop
          LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -eu
          # An ANSWER, not a guess: publish-release.sh decided this and handed
          # it on. Empty means it never said, and a silent skip would leave
          # the badge on this version while the image tag stays on the last
          # one, green all the way.
          case "$LATEST" in
            true) ;;
            false) echo "the release is not the newest one, so latest stays where it is"; exit 0 ;;
            *) echo "::error::publish did not say whether $GITHUB_REF_NAME is the latest release, so the image tag is not moved blindly."; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          # The tag the build pushed, checked rather than assumed: the build
          # derives it from the ref through metadata-action, this job by
          # stripping the v, and a tag those two spell differently would fail
          # here after the release is already public.
          docker buildx imagetools inspect "${IMAGE}:${version}" > /dev/null
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${version}"
          echo "${IMAGE}:latest is ${version}"
