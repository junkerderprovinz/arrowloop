name: Vulnerabilities

# Dependabot flags every advisory in the module graph; govulncheck fails only
# on the ones the code can reach. The weekly run is there because a
# new advisory arrives without anybody pushing anything.
on:
  push:
    branches: [main]
    paths: ["**.go", "**/go.mod", "**/go.sum", ".github/workflows/vuln.yml"]
  pull_request:
    branches: [main]
    paths: ["**.go", "**/go.mod", "**/go.sum", ".github/workflows/vuln.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", "desktop"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
        if: matrix.module == 'desktop'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: ${{ matrix.module }}
