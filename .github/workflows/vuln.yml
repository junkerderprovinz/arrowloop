name: Vulnerabilities

# Dependabot flags every advisory in the module graph; govulncheck fails only
# on the ones the code can reach. The weekly run is there because a
# new advisory arrives without anybody pushing anything.
on:
  push:
    branches: [main]
    paths: ["**.go", "**/go.mod", "**/go.sum", ".github/workflows/vuln.yml"]
  pull_request:
    branches: [main]
    paths: ["**.go", "**/go.mod", "**/go.sum", ".github/workflows/vuln.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "."
          # Wails 3 links GTK 4 unless told otherwise; the desktop build uses
          # GTK 3, which is what the runner has.
          - module: "desktop"
            tags: "gtk3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      # The Ubuntu mirror sometimes stalls without failing, past apt's own
      # timeouts, so each try is cut off and tried again.
      - name: Install GTK and WebKit
        if: matrix.module == 'desktop'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev &&
              exit 0
            sleep 15
          done
          exit 1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags "${{ matrix.tags }}" ./...
        working-directory: ${{ matrix.module }}
