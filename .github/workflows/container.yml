name: Container

# Builds the image and pushes it to GHCR: `edge` from main, and the version
# tags on a release, where release.yml calls this. A pull request builds only.
#
# `latest` belongs to the newest published release, which this workflow cannot
# know about, so release.yml moves it once the release exists.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

# Each part keeps apart two runs that must not cancel each other. The literal
# prefix, because github.workflow is the caller's name under release.yml and
# would put the app and container builds in one group; the caller's name, so a
# direct run and a release run stay apart; the event, so a dispatched test on a
# tag cannot cancel the real release.
concurrency:
  group: container-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Runs the amd64 image and requires an answer before anything is pushed, so an
  # image that dies on startup cannot reach the registry.
  smoke:
    name: Boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git describe needs the tags; a shallow clone has none.
          fetch-depth: 0
      - id: version
        name: Work out what to stamp into the binary
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64 and load it locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arrowloop:smoke
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and ask it a real question
        run: |
          set -eu
          docker run -d --name smoke -p 8422:8422 \
            --cpus 1 --memory 512m \
            -v "$PWD/smoke-config:/config" \
            arrowloop:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8422/api/jobs > /tmp/jobs.json; then
              echo "answered after ${i}s:"; cat /tmp/jobs.json; break
            fi
            sleep 1
          done
          test -s /tmp/jobs.json

          # A first Unraid install starts with an empty /config, where the
          # container writes a starter configuration.
          test -f smoke-config/arrowloop.json

          docker logs smoke | grep -q "IS READY"

          docker exec smoke /usr/local/bin/arrowloop healthcheck

          # Exact equality rather than a pattern: one loose enough to accept a
          # tag and a commit also accepts a branch name such as "main".
          want="$(git describe --tags --always)"
          got="$(docker exec smoke /usr/local/bin/arrowloop version)"
          echo "stamped: ${got}, expected: ${want}"
          test "${got}" = "${want}"

      - name: Show the log and clean up
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true

  push:
    name: Build and push
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: version
        name: Work out what to stamp into the binary
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # The default latest=auto tags every semver build that is not a
          # pre-release, including one whose release never came out.
          flavor: latest=false
          # The tip of the default branch is pullable as `edge` for anyone who
          # asks for it by name.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only a pushed branch or tag publishes; a dispatched run, direct or
          # through release.yml, builds only.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
