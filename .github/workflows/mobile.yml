name: Mobile

# The React Native app. Built here for the same reason the old shell was: a
# GitHub runner arrives with the Android SDK, a JDK and Node already on it, and
# assembling that inside a container to produce one APK is a day of work whose
# only product is a second place for the toolchain to drift.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "android/debug.keystore"
      - ".github/workflows/mobile.yml"
    # A release tag builds the APKs the release publishes, signed with the
    # release key. A tag push ignores the paths above.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign with the release key and check the certificate, publishing nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Signed with the release key on a release tag, and on a dispatched run
      # that asks for it, so the signing can be tried on a branch before a
      # release depends on it. Every other build keeps the public debug key.
      SIGNED: ${{ (github.ref_type == 'tag' || inputs.signed == true) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install the app's dependencies
        working-directory: mobile
        run: npm ci

      - name: The screens compile
        working-directory: mobile
        run: npx tsc --noEmit

      # The translations before anything is built, because this class of bug is
      # silent: getString fills by POSITION, so a translation with fewer
      # placeholders drops the rest of the arguments without a word.
      # The APP's resources, not the old shell's. This was pointing at
      # android/app/src/main/res, which belongs to the WebView build nobody
      # installs any more - so the guard was reading the strings of a
      # different program and reporting that they were fine.
      - name: The translations carry the same placeholders
        run: python android/tools/check_strings.py mobile/native/res

      # And the same question about the app's OWN screens. A key that names the
      # right subject but carries a number renders a literal {count} on the
      # phone, in every language at once, and neither the compiler nor the
      # language parity test can see it: both are happy with a key that exists
      # and a sentence that is translated. Seven screens were doing exactly
      # that, including the one that says how full the bin is.
      - name: The screens ask for keys that exist, with the numbers they need
        run: python mobile/tools/check_keys.py

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # The interface is compiled INTO the engine with go:embed, so it has to
      # exist before Go builds anything - even though the phone never shows it.
      # The engine serves it to a browser on a laptop pointed at the phone, and
      # a binary built without it serves a placeholder instead.
      - name: Build the interface the engine embeds
        run: |
          cd web
          npm ci
          npm run build

      # CGO_ENABLED=0 is what makes this work without the NDK at all.
      # modernc.org/sqlite exists precisely so that is true, and a static
      # binary makes its own syscalls, so it runs on Android's bionic exactly
      # as it does on glibc.
      #
      # The name is not a choice. Since Android 10 an app may not execute a
      # file out of its own data directory, so the binary travels in the native
      # library directory, and only files matching lib*.so are put there.
      - name: Build the engine for both architectures
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
            goarch="${pair%%:*}"
            abi="${pair##*:}"
            mkdir -p "mobile/native/jniLibs/${abi}"
            GOOS=linux GOARCH="${goarch}" go build \
              -trimpath -ldflags="-s -w" \
              -o "mobile/native/jniLibs/${abi}/libarrowloop.so" \
              ./cmd/arrowloop
          done
          ls -la mobile/native/jniLibs/*/

      # The shapes, against a REAL engine, because nothing else can see this
      # class of bug: `src/api.ts` declares what comes back and TypeScript
      # believes every word, so a field the engine calls `reason` and the app
      # calls `error` compiles perfectly and renders an empty string. Four of
      # those shipped at once. The binary built above is a static linux/amd64
      # one, so the runner can simply execute it.
      - name: The app's idea of the answers matches a real engine
        run: |
          set -eux
          work="$(mktemp -d)"
          mkdir -p "$work/left" "$work/right"
          echo one > "$work/left/one.txt"
          echo two > "$work/left/two.txt"
          # TWO JOBS, and the second exists only to have a SCHEDULE. The app
          # declares `nextRun`, which the engine sends only for a job the clock
          # will reach - so a fixture where nothing is scheduled makes that
          # field absent from every object, and the shape check is right to call
          # that out: an optional field that never arrives is how a renamed
          # field hides. The first job keeps no schedule, so the run below is
          # still the only thing that happens.
          #
          # SWITCHED ON, and that is the point rather than an oversight: the
          # engine deliberately reports no due time for a job the clock will not
          # start, so a disabled fixture would leave the field just as absent.
          # What keeps it quiet is the EXPRESSION - the first of January at
          # three is real, valid, and will not come round inside a CI run.
          printf '{"jobs":[{"name":"check","left":"%s/left","right":"%s/right","state":"state/check.db","quietPeriod":"0s"},{"name":"scheduled","left":"%s/left","right":"%s/right","state":"state/scheduled.db","schedule":"0 3 1 1 *"}]}' "$work" "$work" "$work" "$work" > "$work/arrowloop.json"
          cp mobile/native/jniLibs/x86_64/libarrowloop.so "$work/engine"
          chmod +x "$work/engine"
          "$work/engine" web --config "$work/arrowloop.json" --addr 127.0.0.1:18423 &
          engine=$!
          trap 'kill $engine' EXIT
          for _ in $(seq 30); do
            curl -sf -m 2 http://127.0.0.1:18423/api/capabilities > /dev/null && break
            sleep 1
          done
          # Wait for the run to actually finish rather than guessing at three
          # seconds. A fixed sleep makes the guard fail now and then on a slow
          # runner, and a guard that fails at random gets switched off rather
          # than read.
          settle() {
            for _ in $(seq 60); do
              # An answer that did not arrive is not an answer that says
              # "finished". Treating a failed request as done would let the
              # next step race the run it was waiting for.
              state="$(curl -sf -m 5 http://127.0.0.1:18423/api/jobs || true)"
              if [ -n "$state" ] && ! printf '%s' "$state" | grep -q '"running":true'; then
                return 0
              fi
              sleep 1
            done
            echo "the run never finished" >&2
            return 1
          }

          # Real divergence, and a bin with something in it. The shapes that
          # only exist while something is happening are exactly the ones this
          # is for, and a run against two sides that already agree checks
          # nothing - which is why check_shapes fails rather than passes when
          # it could not reach them.
          curl -sf -m 60 -X POST http://127.0.0.1:18423/api/jobs/check/run
          settle
          rm "$work/right/two.txt"
          echo three > "$work/left/three.txt"
          curl -sf -m 60 -X POST http://127.0.0.1:18423/api/jobs/check/run
          settle
          echo four > "$work/left/four.txt"
          # And the SAME file changed on both sides, because that is the only
          # action that carries both versions. A plan made only of copies to
          # the right has no `right` on any action, and the check then cannot
          # tell "this state has no right side" from "nobody calls it that" -
          # which is exactly what it reported the first time this ran.
          echo left >> "$work/left/one.txt"
          echo right >> "$work/right/one.txt"
          sleep 2
          curl -sf -m 10 -X PUT -H 'Content-Type: application/json' -d '{"type":"sftp","settings":{"host":"example.org","user":"nobody"}}' http://127.0.0.1:18423/api/remotes/somewhere
          python mobile/tools/check_shapes.py http://127.0.0.1:18423

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Before anything is generated, so a missing secret stops the run in
      # seconds rather than after the build. A release APK signed with the
      # debug key instead is the one mistake here with no cheap correction:
      # anybody can sign an update for it, and changing the key later means
      # every installed copy has to be uninstalled first.
      - name: The release key is available
        if: env.SIGNED == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing - a published APK must not be signed with the public debug key."
            exit 1
          fi

      # The APK carries the release's version, not whatever app.json last said:
      # otherwise the phone's app info names one version and the release page
      # another. versionCode is what Android orders updates by, so it is derived
      # from the same three numbers and rises with every release. Edited on the
      # runner only, never committed.
      - name: Stamp the version from the tag
        if: github.ref_type == 'tag'
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.GITHUB_REF_NAME.slice(1);
            const [major, minor, patch] = version.split(".").map(Number);
            if (minor > 99 || patch > 99) throw new Error(version + " does not fit versionCode = major*10000 + minor*100 + patch");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = version;
            app.expo.android.versionCode = major * 10000 + minor * 100 + patch;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("version", version, "versionCode", app.expo.android.versionCode);
          '

      # prebuild generates android/ from app.json and the plugins. It is not
      # committed, so this is the only place it exists - which is what keeps
      # plugins/withEngine.js honest: an edit that is not in the plugin does
      # not survive to here.
      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      # After prebuild, because prebuild --clean throws android/ away and would
      # take the engine with it.
      - name: Put the engine in place
        run: |
          set -eux
          mkdir -p mobile/android/app/src/main/jniLibs
          cp -r mobile/native/jniLibs/* mobile/android/app/src/main/jniLibs/
          ls -la mobile/android/app/src/main/jniLibs/*/

      # Outside the workspace, so nothing archived later can sweep it up.
      - name: Unpack the release key
        if: env.SIGNED == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # RELEASE and not debug, and that is not about optimisation. A React
      # Native DEBUG build expects Metro, the development server, to hand it
      # the JavaScript at runtime - installed on a phone with no Metro it shows
      # a red screen saying "Unable to load script". The release build packages
      # the bundle into the APK, which is what makes it a program somebody can
      # be given.
      #
      # It is signed with the debug key at android/debug.keystore, which the
      # config plugin points the template at. Stable, so a build installs over
      # the previous one; public, so it is not fit for publishing anywhere. A
      # signed build gets the release key instead, through the same plugin and
      # the four variables below.
      - name: Assemble
        working-directory: mobile/android
        env:
          ARROWLOOP_ANDROID_KEYSTORE: ${{ env.SIGNED == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ARROWLOOP_ANDROID_STORE_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ARROWLOOP_ANDROID_KEY_ALIAS: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ARROWLOOP_ANDROID_KEY_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the outputs
        working-directory: mobile
        run: |
          set -eux
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/arrowloop-$(basename "$f")"
          done
          ls -la out/

      # The variables having been set is no proof the APKs came out signed with
      # them: a template the plugin stopped matching, or a keystore holding
      # another alias, ends in a debug-signed file and a green build. The
      # certificate inside each finished APK is what answers the question.
      - name: The APKs carry the release key
        if: env.SIGNED == 'true'
        working-directory: mobile
        run: |
          set -eu
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::no apksigner in $ANDROID_HOME/build-tools, so nothing can say which key signed these APKs."
            exit 1
          fi
          for apk in out/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk"
            echo "$certs"
            if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::error::$apk is signed with the public Android debug key. Check the ANDROID_KEYSTORE_* secrets and mobile/plugins/withEngine.js."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arrowloop-mobile
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: 14

  # The APKs on the release, for the README's download button and for anybody
  # who wants the app without building it.
  attach:
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arrowloop-mobile
          path: apk

      # Named like the desktop bundles: the version in the name, so a download
      # in somebody's folder still says what it is, and a second copy without
      # it, because /releases/latest/download/ needs a name that does not
      # change from one release to the next.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp apk/arrowloop-app-arm64-v8a-release.apk "dist/arrowloop-${GITHUB_REF_NAME}-android-arm64.apk"
          cp apk/arrowloop-app-x86_64-release.apk "dist/arrowloop-${GITHUB_REF_NAME}-android-x86_64.apk"
          for f in dist/arrowloop-"${GITHUB_REF_NAME}"-*; do
            cp "$f" "$(echo "$f" | sed "s/-${GITHUB_REF_NAME}-/-/")"
          done
          ls -lh dist

      # release.yml creates the release within a minute, and this build takes
      # far longer, but a runner queue can turn that round.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "no release for $GITHUB_REF_NAME after five minutes" >&2
          exit 1

      - name: Attach the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
