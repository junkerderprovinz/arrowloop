name: Mobile

# The React Native app. A GitHub runner arrives with the Android SDK, a JDK and
# Node installed, so the toolchain lives in one place only.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "android/debug.keystore"
      - ".github/workflows/mobile.yml"
  # On a release tag release.yml calls this and publishes the APKs it keeps as
  # an artifact. github.event_name is then the tag push, which RELEASE and
  # SIGNED below rely on.
  workflow_call:
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign with the release key and check the certificate; no artifact, no release"
        type: boolean
        default: false

permissions:
  contents: read

# Each part keeps apart two runs that must not cancel each other. The literal
# prefix, because github.workflow is the caller's name under release.yml and
# would put the app and container builds in one group; the caller's name, so a
# direct run and a release run stay apart; the event, so a dispatched test on a
# tag cannot cancel the real release.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A release is a pushed version tag; a run dispatched on a tag ref is a
      # test and publishes nothing.
      RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'true' || 'false' }}
      # A dispatched run can ask for the release key, so signing can be tried
      # on a branch before a release depends on it.
      SIGNED: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.signed == true) && 'true' || 'false' }}
      # The release certificate as apksigner prints it; public, since every APK
      # carries it. A wrong keystore in the secrets then fails the build instead
      # of publishing APKs no later release can update.
      RELEASE_CERT_SHA256: 13477be473caf942e1c6d0fabee878776f32c849c2341c2541893a3474ab10e6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install the app's dependencies
        working-directory: mobile
        run: npm ci

      - name: The screens compile
        working-directory: mobile
        run: npx tsc --noEmit

      # getString fills by position, so a translation with fewer placeholders
      # silently drops the remaining arguments.
      - name: The translations carry the same placeholders
        run: python android/tools/check_strings.py mobile/native/res

      # A key used without the number it carries renders a literal {count},
      # which neither the compiler nor the language parity test can see.
      - name: The screens ask for keys that exist, with the numbers they need
        run: python mobile/tools/check_keys.py

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # The phone never shows it, but the engine serves it to a browser pointed
      # at the phone, and without it serves a placeholder.
      - name: Build the interface the engine embeds
        run: |
          cd web
          npm ci
          npm run build

      # CGO_ENABLED=0 needs no NDK: the engine is pure Go (modernc.org/sqlite
      # included), and a static binary makes its own syscalls, so it runs on
      # bionic as it does on glibc.
      #
      # Since Android 10 an app may not execute a file from its data directory,
      # so the binary travels in the native library directory, which takes only
      # files named lib*.so.
      - name: Build the engine for both architectures
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
            goarch="${pair%%:*}"
            abi="${pair##*:}"
            mkdir -p "mobile/native/jniLibs/${abi}"
            GOOS=linux GOARCH="${goarch}" go build \
              -trimpath -ldflags="-s -w" \
              -o "mobile/native/jniLibs/${abi}/libarrowloop.so" \
              ./cmd/arrowloop
          done
          ls -la mobile/native/jniLibs/*/

      # TypeScript trusts the shapes `src/api.ts` declares, so a field the
      # engine calls `reason` and the app calls `error` compiles and renders
      # empty. The x86_64 engine built above runs on the runner as it is.
      - name: The app's idea of the answers matches a real engine
        run: |
          set -eux
          work="$(mktemp -d)"
          mkdir -p "$work/left" "$work/right"
          echo one > "$work/left/one.txt"
          echo two > "$work/left/two.txt"
          # The second job exists to have a schedule: the engine sends
          # `nextRun` only for an enabled job the clock will reach, and the
          # shape check rejects a field that never arrives. The first of January
          # at three will not come round inside a CI run.
          printf '{"jobs":[{"name":"check","left":"%s/left","right":"%s/right","state":"state/check.db","quietPeriod":"0s"},{"name":"scheduled","left":"%s/left","right":"%s/right","state":"state/scheduled.db","schedule":"0 3 1 1 *"}]}' "$work" "$work" "$work" "$work" > "$work/arrowloop.json"
          cp mobile/native/jniLibs/x86_64/libarrowloop.so "$work/engine"
          chmod +x "$work/engine"
          "$work/engine" web --config "$work/arrowloop.json" --addr 127.0.0.1:18423 &
          engine=$!
          trap 'kill $engine' EXIT
          for _ in $(seq 30); do
            curl -sf -m 2 http://127.0.0.1:18423/api/capabilities > /dev/null && break
            sleep 1
          done
          # A fixed sleep would fail now and then on a slow runner.
          settle() {
            for _ in $(seq 60); do
              # A failed request does not mean the run finished.
              state="$(curl -sf -m 5 http://127.0.0.1:18423/api/jobs || true)"
              if [ -n "$state" ] && ! printf '%s' "$state" | grep -q '"running":true'; then
                return 0
              fi
              sleep 1
            done
            echo "the run never finished" >&2
            return 1
          }

          # Real divergence and a bin with something in it, since some shapes
          # exist only while something is happening; check_shapes fails when it
          # could not reach them.
          curl -sf -m 60 -X POST http://127.0.0.1:18423/api/jobs/check/run
          settle
          rm "$work/right/two.txt"
          echo three > "$work/left/three.txt"
          curl -sf -m 60 -X POST http://127.0.0.1:18423/api/jobs/check/run
          settle
          echo four > "$work/left/four.txt"
          # One file changed on both sides, the only action that carries both
          # versions, so the plan has a `right` for the check to see.
          echo left >> "$work/left/one.txt"
          echo right >> "$work/right/one.txt"
          sleep 2
          curl -sf -m 10 -X PUT -H 'Content-Type: application/json' -d '{"type":"sftp","settings":{"host":"example.org","user":"nobody"}}' http://127.0.0.1:18423/api/remotes/somewhere
          python mobile/tools/check_shapes.py http://127.0.0.1:18423

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Checked early, since a release APK signed with the public debug key
      # lets anybody sign an update for it, and changing the key later means
      # every installed copy has to be uninstalled first.
      - name: The release key is available
        if: env.SIGNED == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing. A published APK must not be signed with the public debug key."
            exit 1
          fi

      # The APK takes the tag's version rather than app.json's, so the phone's
      # app info and the release page agree. Android orders updates by
      # versionCode, so it rises with every release.
      - name: Stamp the version from the tag
        if: env.RELEASE == 'true'
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs");
            if (!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(process.env.GITHUB_REF_NAME)) throw new Error(process.env.GITHUB_REF_NAME + " is not a vX.Y.Z tag");
            const version = process.env.GITHUB_REF_NAME.slice(1);
            const [major, minor, patch] = version.split(".").map(Number);
            if (minor > 99 || patch > 99) throw new Error(version + " does not fit versionCode = major*10000 + minor*100 + patch");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = version;
            app.expo.android.versionCode = major * 10000 + minor * 100 + patch;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("version", version, "versionCode", app.expo.android.versionCode);
          '

      # android/ is not committed, so any native change has to live in
      # plugins/withEngine.js to survive to here.
      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      # prebuild --clean throws android/ away, engine included.
      - name: Put the engine in place
        run: |
          set -eux
          mkdir -p mobile/android/app/src/main/jniLibs
          cp -r mobile/native/jniLibs/* mobile/android/app/src/main/jniLibs/
          ls -la mobile/android/app/src/main/jniLibs/*/

      # Outside the workspace, so nothing archived later can sweep it up.
      - name: Unpack the release key
        if: env.SIGNED == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # A React Native debug build loads its JavaScript from Metro at runtime;
      # only the release build packages the bundle into the APK. Unless SIGNED,
      # it is signed with the stable, public android/debug.keystore.
      - name: Assemble
        working-directory: mobile/android
        env:
          ARROWLOOP_ANDROID_KEYSTORE: ${{ env.SIGNED == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ARROWLOOP_ANDROID_STORE_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ARROWLOOP_ANDROID_KEY_ALIAS: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ARROWLOOP_ANDROID_KEY_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the outputs
        working-directory: mobile
        run: |
          set -eux
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/arrowloop-$(basename "$f")"
          done
          ls -la out/

      # A template the plugin stopped matching, or a keystore holding another
      # alias, ends in a debug-signed file and a green build.
      - name: The APKs carry the release key
        if: env.SIGNED == 'true'
        working-directory: mobile
        run: |
          set -eu
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::no apksigner in $ANDROID_HOME/build-tools, so nothing can say which key signed these APKs."
            exit 1
          fi
          for apk in out/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk"
            echo "$certs"
            # Both "Signer #1 certificate SHA-256 digest" and "V3.0 Signer:
            # certificate SHA-256 digest" occur; more than one distinct key is a
            # mismatch too.
            digests=$(echo "$certs" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $4}' | sort -u)
            if [ "$digests" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::$apk is signed by $digests, not by the release certificate $RELEASE_CERT_SHA256. Check the ANDROID_KEYSTORE_* secrets and mobile/plugins/withEngine.js."
              exit 1
            fi
          done

      # An APK carrying the release key leaves only through a release. A
      # release keeps its artifact as long as the desktop bundles, so re-running
      # a failed publish later still finds both.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.RELEASE == 'true' || env.SIGNED != 'true'
        with:
          name: arrowloop-mobile
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: ${{ env.RELEASE == 'true' && 90 || 14 }}
