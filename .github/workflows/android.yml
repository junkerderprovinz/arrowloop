name: Android

# A GitHub runner arrives with the Android SDK, a JDK and the build tools
# installed, so the toolchain lives in one place only.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # `getString` fills by position, so a translation with fewer placeholders
      # than the original silently drops the remaining arguments.
      - name: The translations carry the same placeholders
        run: python android/tools/check_strings.py

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The engine embeds the interface; without it the binary serves a
      # placeholder page.
      - name: Build the interface
        run: |
          cd web
          npm ci
          npm run build

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 needs no NDK: the engine is pure Go (modernc.org/sqlite
      # included), and a static binary makes its own syscalls, so it runs on
      # bionic as it does on glibc.
      #
      # Since Android 10 an app may not execute a file from its data directory,
      # so the binary travels in the native library directory, which takes only
      # files named lib*.so.
      - name: Build the engine for both architectures
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
            goarch="${pair%%:*}"
            abi="${pair##*:}"
            mkdir -p "android/app/src/main/jniLibs/${abi}"
            GOOS=linux GOARCH="${goarch}" go build \
              -trimpath -ldflags="-s -w" \
              -o "android/app/src/main/jniLibs/${abi}/libarrowloop.so" \
              ./cmd/arrowloop
          done
          ls -la android/app/src/main/jniLibs/*/

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The release APK is unsigned, since a throwaway key would give an app
      # that can never be updated, and an unsigned APK cannot be installed. The
      # debug build is the installable one: it signs with the committed
      # android/debug.keystore (app/build.gradle.kts says why).
      - name: Assemble
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Name the outputs
        working-directory: android
        run: |
          set -eux
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/arrowloop-$(basename "$f")"
          done
          ls -la out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arrowloop-android
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 14
