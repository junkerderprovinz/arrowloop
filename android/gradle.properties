# The engine is 75 MB per architecture and Gradle holds packaging in memory.
# The default heap turns the APK step into an OutOfMemoryError that names Java
# rather than the file that caused it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
